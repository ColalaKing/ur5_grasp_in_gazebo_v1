version: "3.8"

services:
  ur5_grasp:
    build:
      context: .
      dockerfile: Dockerfile
    image: ur5-grasp-kinetic:latest
    container_name: ur5_grasp_kinetic
    # 注意：下面这行必须注释掉，Mac 不支持 host 模式直通
    # network_mode: host
    ports:
      - "127.0.0.1:5901:5900" # Only expose VNC on this Mac.
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=1
      - GAZEBO_MODEL_PATH=/usr/share/gazebo-7/models:/usr/share/gazebo/models:/root/.gazebo/models
      - GAZEBO_RESOURCE_PATH=/usr/share/gazebo-7:/usr/share/gazebo
      - ROS_MASTER_URI=http://127.0.0.1:11311
      - ROS_IP=127.0.0.1
    volumes:
      - ./:/root/arm_ws/src/ur5_grasp_in_gazebo
      - ~/.gazebo:/root/.gazebo
    stdin_open: true
    tty: true
