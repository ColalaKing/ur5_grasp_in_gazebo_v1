# Task table for task_manager (default)
#
# 放置约束：grasp_executor 永远把 digit_x 放到 grid_x，所以每个可执行步骤必须满足
#   pick_digit == place_grid == final_class_id
#
# 可达性结论（UR5 base 系 hypot(x,y) <= reach_radius_xy=0.80）：
#   放置侧（与 seed 无关，格子位置固定，经 spawn_offset_y=0.7 换算到 base 系）：
#     - grid 4/5/6（底排）可达：base hypot ≈ 0.74~0.78
#     - grid 1/2/3（上排）不可达：base hypot ≈ 0.92~0.95
#   抓取侧（与 seed 有关）：方块 spawn 在 x∈[0.34,0.75], y∈[-0.3,0.28]，
#     多数位置 hypot<=0.80 可抓；个别靠最远角的方块可能超出，会被 skip。
#
# 因此推荐的序列演示用底排 4/5/6（放置一定可达），抓取侧靠 unreachable_policy:=skip
# 自动跳过偶发够不到的方块，保证不会全局失败。
#
# 重要：录制时务必让 4 个终端（仿真 / 检测定位 / grasp_executor / task_manager）
# 全程保持运行，不要 Ctrl+C 掉 grasp_executor，否则 task_manager 会等不到
# /grasp/status done 而超时（failure_type=规划失败 / timeout）。
#
# 换 seed 时无需改放置侧结论；只是抓取侧哪些方块够得到会变。
task_table:
  - order: 1
    pick_digit: 6
    place_grid: 6
    priority: 10

  - order: 2
    pick_digit: 5
    place_grid: 5
    priority: 8


